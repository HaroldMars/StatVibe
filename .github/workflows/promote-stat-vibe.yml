# Points https://stat-vibe.vercel.app at the newest READY client deployment.
#
# Use when Instant Rollback (or a canceled deploy) has pinned production and
# new Git pushes no longer receive the production domain automatically.
#
# Required GitHub secret: VERCEL_TOKEN
# Optional: VERCEL_ORG_ID / VERCEL_PROJECT_ID or STAT_VIBE_ORG_ID / STAT_VIBE_PROJECT_ID
# (script defaults to Illuminary Peak / stat-vibe when unset)
name: Promote stat-vibe production
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: 'Optional deployment id (dpl_…) to alias (default: newest READY)'
        required: false
        type: string
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Alias production domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAT_VIBE_ORG_ID: ${{ secrets.STAT_VIBE_ORG_ID }}
          STAT_VIBE_PROJECT_ID: ${{ secrets.STAT_VIBE_PROJECT_ID }}
          VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_ID: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing secret VERCEL_TOKEN"
            exit 1
          fi
          export VERCEL_ORG_ID="${STAT_VIBE_ORG_ID:-${VERCEL_ORG_ID_SECRET:-}}"
          export VERCEL_PROJECT_ID="${STAT_VIBE_PROJECT_ID:-${VERCEL_PROJECT_ID_SECRET:-}}"
          node scripts/promote-stat-vibe-alias.mjs
