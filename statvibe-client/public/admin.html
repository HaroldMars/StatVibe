<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0e1b18" />
  <title>StatVibe · Developer Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e1b18'/%3E%3Ctext x='50' y='70' font-size='58' font-family='monospace' font-weight='700' fill='%237fe3c8' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { display: block; padding: 0; background: var(--bg); }
    .adm-wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
    .adm-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 22px; }
    .adm-brand { display: flex; align-items: center; gap: 11px; }
    .adm-logo { width: 40px; height: 40px; border-radius: 11px; background: var(--teal-ink); color: var(--mint); display: flex; align-items: center; justify-content: center; font: 700 18px var(--mono); }
    .adm-brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.2px; }
    .adm-brand .sub { font-size: 11.5px; color: var(--muted-2); }
    .adm-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .adm-login { max-width: 380px; margin: 8vh auto 0; }
    .adm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 620px) { .adm-grid { grid-template-columns: 1fr; } }
    .adm-eyebrow { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; margin: 0 0 10px; }
    .adm-kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
    .adm-kv:last-child { border-bottom: none; }
    .adm-kv .v { font-family: var(--mono); color: var(--ink); }
    .adm-log { font-family: var(--mono); font-size: 10.5px; line-height: 1.6; color: var(--muted); max-height: 200px; overflow: auto; white-space: pre-wrap; }
    .adm-out { background: var(--chip); border-radius: 10px; padding: 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; max-height: 240px; overflow: auto; margin-top: 10px; }
    .adm-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
    .adm-row:last-child { border-bottom: none; }
    textarea, input, select { font-family: inherit; }
    .adm-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (max-width: 720px) { .adm-stat-grid { grid-template-columns: repeat(2, 1fr); } }
    .adm-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; }
    .adm-stat .n { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
    .adm-stat .l { font-size: 11px; color: var(--muted-2); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .adm-bars { display: flex; align-items: flex-end; gap: 10px; height: 96px; padding-top: 8px; }
    .adm-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .adm-bar > i { width: 100%; max-width: 36px; border-radius: 6px 6px 2px 2px; display: block; background: var(--teal); }
    .adm-bar span { font-size: 10px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .adm-bar b { font-size: 11px; font-family: var(--mono); }
    .adm-spark { display: flex; align-items: flex-end; gap: 3px; height: 56px; }
    .adm-spark-col { flex: 1; display: flex; align-items: flex-end; height: 100%; }
    .adm-spark-col i { display: block; width: 100%; border-radius: 3px 3px 1px 1px; background: linear-gradient(180deg, var(--teal), #a8b0ff); min-height: 2px; }
    .adm-spark-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--muted-3); }
  </style>
</head>
<body>
  <div class="adm-wrap" id="adm"><!-- rendered by admin.js --></div>
  <div class="toast" id="toast" style="position:fixed;left:50%;bottom:32px"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
