<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="StatVibe logo">
  <defs>
    <!-- diagonal pastel gradient: sage green (top-left) → soft pink (bottom-right) -->
    <linearGradient id="sv-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7d9bf"/>
      <stop offset="0.32" stop-color="#d7e6d8"/>
      <stop offset="0.5" stop-color="#eef0ec"/>
      <stop offset="0.68" stop-color="#ecd7e4"/>
      <stop offset="1" stop-color="#e7c2da"/>
    </linearGradient>
    <filter id="sv-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sv-tile"><rect x="2" y="2" width="96" height="96" rx="24"/></clipPath>
  </defs>

  <!-- white rounded app tile -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#ffffff"/>

  <!-- four-point concave sparkle, points reaching to the corners -->
  <g clip-path="url(#sv-tile)">
    <g transform="rotate(45 50 50)" filter="url(#sv-shadow)">
      <path fill="url(#sv-grad)" d="
        M50 2
        C 52.5 38, 62 47.5, 98 50
        C 62 52.5, 52.5 62, 50 98
        C 47.5 62, 38 52.5, 2 50
        C 38 47.5, 47.5 38, 50 2 Z"/>
    </g>
  </g>

  <!-- hairline edge to sit cleanly on light backgrounds -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" fill="none" stroke="rgba(17,20,24,0.10)"/>
</svg>
